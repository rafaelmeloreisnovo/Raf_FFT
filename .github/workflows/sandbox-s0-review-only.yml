name: RAF FFT S0 - public synthetic validation (no private connections)
on:
  pull_request:
    paths:
      - '.github/workflows/sandbox-s0-review-only.yml'
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raffft-s0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check public pilot boundary (heuristic)
        run: python3 scripts/check-public-boundary.py
      - name: Compile and run offline synthetic gates
        run: bash scripts/test-local.sh
  android-debug:
    needs: offline-java
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build local-only diagnostic APK (no auth, no secrets)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Artifact byte SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: raffft-s0-debug-untrusted-no-signing
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
          retention-days: 3
          if-no-files-found: error
